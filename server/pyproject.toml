[project]
name = "server"
version = "0.1.0"
description = "Real-time financial crime intelligence engine — generator, HeteroSAGE, live serve"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "networkx>=3.7",
    "numpy>=2.0",
    "torch>=2.0",
    "torch-geometric>=2.5",
    "websockets>=13.0",
]

[project.scripts]
aml-sim = "aml.cli:main"
aml-train = "aml.train:main"
aml-report = "aml.report:main"
aml-serve = "aml.serve:main"
aml-ibm-convert = "aml.ibm_convert:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["aml"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
